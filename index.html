<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Софа</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1a0b2e 0%, #2d1b4e 40%, #0f0c29 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20px 30px, #fff, transparent),
      radial-gradient(2px 2px at 40px 70px, #fff, transparent),
      radial-gradient(1px 1px at 90px 40px, #fff, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(2px 2px at 160px 30px, #fff, transparent),
      radial-gradient(1px 1px at 200px 120px, #fff, transparent),
      radial-gradient(1px 1px at 250px 60px, #fff, transparent),
      radial-gradient(2px 2px at 300px 150px, #fff, transparent);
    background-size: 350px 200px;
    opacity: 0.7;
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  [club66008961|@keyframes] twinkle { from { opacity: .4 } to { opacity: .9 } }

  .glow {
    position: absolute;
    width: 90vw; max-width: 500px;
    aspect-ratio: 1;
    background: radial-gradient(circle, rgba(200,80,255,.35), transparent 70%);
    border-radius: 50%;
    animation: pulse 5s ease-in-out infinite;
    filter: blur(40px);
  }
  [club66008961|@keyframes] pulse {
    0%,100% { transform: scale(1); opacity: .6 }
    50% { transform: scale(1.25); opacity: .9 }
  }

  /* --- НОВЫЙ БЛОК: Имя Софа сверху --- */
  .name-top {
    position: relative;
    z-index: 3;
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ff9ecd, #c084fc, #ff9ecd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shimmer 3s linear infinite, floatName 3s ease-in-out infinite;
    text-shadow: 0 0 40px rgba(255, 110, 196, 0.6);
  }
  [club66008961|@keyframes] shimmer { to { background-position: 200% center } }
  [club66008961|@keyframes] floatName {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  /* ----------------------------------- */

  .card {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 40px 24px;
    margin: 16px;
    max-width: 420px;
    border-radius: 30px;
    background: rgba(255,255,255,.07);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: fadeIn 1.2s ease;
  }
  [club66008961|@keyframes] fadeIn {
    from { opacity: 0; transform: translateY(30px) }
    to { opacity: 1; transform: translateY(0) }
  }

  .title {
    font-size: clamp(1.3rem, 6vw, 2rem);
    line-height: 1.4;
    color: #fff;
    text-shadow: 0 0 20px rgba(200,100,255,.8);
    margin-bottom: 36px;
    font-weight: 600;
  }
  .title span {
    background: linear-gradient(90deg, #ff9ecd, #c084fc, #ff9ecd);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    animation: shimmer 3s linear infinite;
    display: inline-block;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    min-height: 60px;
  }

  button {
    font-size: clamp(1rem, 5vw, 1.3rem);
    font-weight: 600;
    padding: 16px 42px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  #yesBtn {
    background: linear-gradient(135deg, #ff6ec4, #b46ef0);
    color: #fff;
    box-shadow: 0 10px 30px rgba(255,110,196,.5);
    animation: breathe 2s ease-in-out infinite;
    transition: transform .15s ease;
  }
  @keyframes breathe {
    0%,100% { box-shadow: 0 10px 30px rgba(255,110,196,.5) }
    50% { box-shadow: 0 10px 50px rgba(255,110,196,.9) }
  }
  #yesBtn:active { transform: scale(.95); }

  #noBtn {
    background: rgba(255,255,255,.1);
    color: #ddd;
    border: 1px solid rgba(255,255,255,.25);
    transition: left .18s ease, top .18s ease, transform .18s ease;
  }

  .final {
    font-size: clamp(1.4rem, 6.5vw, 2.2rem);
    color: #fff;
    text-shadow: 0 0 30px rgba(255,110,196,.9);
    animation: fadeIn 1s ease;
  }
  .heart {
    font-size: 4rem;
    display: block;
    margin-bottom: 20px;
    animation: beat 1s ease-in-out infinite;
  }
  @keyframes beat {
    0%,100% { transform: scale(1) }
    15% { transform: scale(1.2) }
    30% { transform: scale(1) }
    45% { transform: scale(1.15) }
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="glow"></div>

<!-- Блок с именем -->
<div class="name-top">Софа</div>

<div class="card" id="card">
  <div class="title">Ты мне нравишься...
<span>Станешь моей первой девушкой?</span></div>
  <div class="buttons" id="buttons">
    <button id="yesBtn">Да 💖</button>
    <button id="noBtn">Нет</button>
  </div>
</div>

<script>
  const noBtn  = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const card   = document.getElementById('card');

  let noMoved = false;

  function runAway(e) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    const r = noBtn.getBoundingClientRect();

    if (!noMoved) {
      noBtn.style.position = 'fixed';
      noBtn.style.left = r.left + 'px';
      noBtn.style.top  = r.top  + 'px';
      noBtn.style.zIndex = 999;
      noMoved = true;
      requestAnimationFrame(() => moveToRandom());
    } else {
      moveToRandom();
    }
  }

  function moveToRandom() {
    const r = noBtn.getBoundingClientRect();
    const pad = 16;
    const maxX = window.innerWidth  - r.width  - pad;
    const maxY = window.innerHeight - r.height - pad;

    let newX, newY, dist;
    let tries = 0;
    do {
      newX = pad + Math.random() * Math.max(1, maxX - pad);
      newY = pad + Math.random() * Math.max(1, maxY - pad);
      dist = Math.hypot(newX - r.left, newY - r.top);
      tries++;
    } while (dist < 200 && tries < 20);

    noBtn.style.left = newX + 'px';
    noBtn.style.top  = newY + 'px';
    noBtn.style.transform = `rotate(${(Math.random() - .5) * 25}deg) scale(${.75 + Math.random() * .25})`;
  }

  noBtn.addEventListener('touchstart', runAway, { passive: false });
  noBtn.addEventListener('click', (e) => { e.preventDefault(); runAway(e); });
  document.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (!t) return;
    const r = noBtn.getBoundingClientRect();
    const d = Math.hypot(t.clientX - (r.left + r.width/2), t.clientY - (r.top + r.height/2));
    if (d < 80) runAway(e);
  }, { passive: false });

  noBtn.addEventListener('mouseenter', runAway);
  noBtn.addEventListener('mouseover', runAway);
  document.addEventListener('mousemove', (e) => {
    const r = noBtn.getBoundingClientRect();
    const d = Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
    if (d < 90) runAway(e);
  });

  yesBtn.addEventListener('click', () => {
    card.innerHTML = `
      <span class="heart">💖</span>
      <div class="final">Софа, я знал, что ты скажешь «Да»!
Ты самая лучшая 🥰</div>
    `;
  });
</script>

</body>
</html>
